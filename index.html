<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Label Splitter - Perfect Join Guide (Support PDF & Image)</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>

<style>
*{ box-sizing:border-box; }

body{
    margin:0;
    padding:18px;
    background:#111;
    color:#fff;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    text-align:center;
}

.card{
    background:#222;
    border:1px solid #444;
    border-radius:22px;
    padding:22px;
    max-width:460px;
    margin:auto;
}

h2{ margin-top:0; }

.hint{
    color:#aaa;
    font-size:13px;
    line-height:1.5;
}

select{
    width:100%;
    padding:15px;
    border-radius:12px;
    background:#333;
    color:white;
    border:1px solid #555;
    margin:15px 0;
    font-size:16px;
}

.btn-upload{
    display:block;
    background:#007aff;
    color:white;
    padding:18px;
    border-radius:14px;
    font-weight:bold;
    cursor:pointer;
    margin-top:10px;
}

#pdf-upload{ display:none; }

#status{
    margin-top:15px;
    color:#00ea8c;
    font-weight:bold;
    min-height:24px;
}

#preview-wrap{
    margin-top:20px;
    overflow:auto;
    text-align:center;
}

canvas{
    display:none;
    width:100%;
    max-width:900px;
    height:auto;
    background:white;
    border-radius:10px;
    border:1px solid #444;
}

.btn-share{
    display:none;
    width:100%;
    max-width:460px;
    margin:20px auto 0;
    background:#ff3b30;
    color:white;
    border:none;
    border-radius:16px;
    padding:20px;
    font-size:20px;
    font-weight:bold;
    cursor:pointer;
}
</style>
</head>

<body>

<div class="card">
    <h2>Label Splitter</h2>
    <p class="hint">
        แบ่งใบปะหน้า / รองรับ PDF และรูปภาพ / เส้นประหัว-กลาง-ท้าย สำหรับตัดแล้วประกบตรง
    </p>

    <select id="split-num">
        <option value="2" selected>แบ่ง 2 ท่อน</option>
        <option value="3">แบ่ง 3 ท่อน</option>
    </select>

    <label class="btn-upload" for="pdf-upload">📂 เลือกไฟล์ PDF หรือ รูปภาพ</label>
    <input type="file" id="pdf-upload" accept="application/pdf, image/*">

    <div id="status">รอไฟล์...</div>
</div>

<button id="share-btn" class="btn-share">📤 ส่งรูปไปปริ้น</button>

<div id="preview-wrap">
    <canvas id="canvas-preview"></canvas>
</div>

<script>
const pdfjsLib = window["pdfjs-dist/build/pdf"];
pdfjsLib.GlobalWorkerOptions.workerSrc =
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js";

const pdfInput = document.getElementById("pdf-upload");
const statusBox = document.getElementById("status");
const shareBtn = document.getElementById("share-btn");
const previewCanvas = document.getElementById("canvas-preview");
const splitSelect = document.getElementById("split-num");

/* =========================
   ตั้งค่าหลัก (คงเดิม)
========================= */
const PDF_RENDER_SCALE = 6;
const OUTER_MARGIN = 90;
const BETWEEN_PART_GAP = 90;
const SIDE_PADDING_INSIDE_PART = 36;
const PAGE_GAP = 150;
const SPLIT_SEARCH_LIMIT = 420;
const CONTENT_PAD = 35;

/* =========================
   ตั้งค่าเส้นประ (คงเดิม)
========================= */
const GUIDE_INSET = 60;
const GUIDE_LINE_WIDTH = 5;
const GUIDE_COLOR = "rgba(0,0,0,0.95)";
const GUIDE_DASH = [12, 8];

let lastFile = null;

pdfInput.addEventListener("change", async (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    lastFile = file;
    await runSplitter(file);
});

splitSelect.addEventListener("change", async ()=>{
    if(lastFile) await runSplitter(lastFile);
});

// ฟังก์ชันช่วยโหลดรูปภาพ
function loadImage(file) {
    return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (e) => {
            const img = new Image();
            img.onload = () => resolve(img);
            img.onerror = reject;
            img.src = e.target.result;
        };
        reader.readAsDataURL(file);
    });
}

async function runSplitter(file){
    try{
        previewCanvas.style.display = "none";
        shareBtn.style.display = "none";
        statusBox.innerText = "⚖️ กำลังประมวลผล...";

        const numParts = parseInt(splitSelect.value, 10);
        const allPagesContent = [];

        if (file.type === "application/pdf") {
            const arrayBuffer = await file.arrayBuffer();
            const pdf = await pdfjsLib.getDocument({ data:arrayBuffer }).promise;
            for(let i=1; i<=pdf.numPages; i++){
                statusBox.innerText = `📄 กำลังจัดหน้า ${i}/${pdf.numPages}...`;
                const page = await pdf.getPage(i);
                const parts = await processPageParts(page, numParts, "pdf");
                if(parts && parts.length) allPagesContent.push(parts);
            }
        } else if (file.type.startsWith("image/")) {
            statusBox.innerText = `🖼️ กำลังจัดการรูปภาพ...`;
            const imgElement = await loadImage(file);
            const parts = await processPageParts(imgElement, numParts, "image");
            if(parts && parts.length) allPagesContent.push(parts);
        }

        if(!allPagesContent.length){
            statusBox.innerText = "❌ ไม่พบเนื้อหาในไฟล์";
            return;
        }

        renderFinalCombined(allPagesContent);
        previewCanvas.style.display = "block";
        shareBtn.style.display = "block";
        statusBox.innerText = "✅ เสร็จแล้ว พร้อมปริ้น";
    }catch(err){
        console.error(err);
        statusBox.innerText = "❌ เกิดข้อผิดพลาด";
    }
}

async function processPageParts(source, numParts, type){
    const canvas = document.createElement("canvas");
    const ctx = canvas.getContext("2d", { willReadFrequently:true, alpha:false });

    if (type === "pdf") {
        const viewport = source.getViewport({ scale:PDF_RENDER_SCALE });
        canvas.width = Math.ceil(viewport.width);
        canvas.height = Math.ceil(viewport.height);
        ctx.fillStyle = "white";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        await source.render({ canvasContext:ctx, viewport }).promise;
    } else {
        // สำหรับรูปภาพ
        canvas.width = source.width;
        canvas.height = source.height;
        ctx.fillStyle = "white";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(source, 0, 0);
    }

    const rect = getContentRect(ctx, canvas.width, canvas.height);
    if(!rect) return null;

    const topY = rect.y;
    const bottomY = rect.y + rect.h;
    const contentH = bottomY - topY;

    const splitPoints = [topY];
    for(let j=1; j<numParts; j++){
        const targetY = topY + Math.round((contentH / numParts) * j);
        const bestY = findBestSplitGap(ctx, rect.x, targetY, rect.w, topY, bottomY);
        splitPoints.push(bestY);
    }
    splitPoints.push(bottomY);
    splitPoints.sort((a,b)=>a-b);

    const parts = [];
    for(let k=0; k<splitPoints.length-1; k++){
        const startY = splitPoints[k];
        const endY = splitPoints[k+1];
        const h = Math.max(1, endY - startY);
        const w = rect.w;

        const partCanvas = document.createElement("canvas");
        const pCtx = partCanvas.getContext("2d", { alpha:false });
        partCanvas.width = h;
        partCanvas.height = w + (SIDE_PADDING_INSIDE_PART * 2);

        pCtx.fillStyle = "white";
        pCtx.fillRect(0, 0, partCanvas.width, partCanvas.height);
        pCtx.save();
        pCtx.translate(0, w + SIDE_PADDING_INSIDE_PART);
        pCtx.rotate(-Math.PI / 2);
        pCtx.imageSmoothingEnabled = true;
        pCtx.imageSmoothingQuality = "high";
        pCtx.drawImage(canvas, rect.x, startY, w, h, 0, 0, w, h);
        pCtx.restore();
        parts.push(partCanvas);
    }
    return parts;
}

// อัลกอริทึมการคำนวณ (คงเดิมทั้งหมด)
function findBestSplitGap(ctx, x, targetY, w, minY, maxY){
    let bestY = targetY;
    let bestScore = Infinity;
    const start = Math.max(minY + 30, targetY - SPLIT_SEARCH_LIMIT);
    const end = Math.min(maxY - 30, targetY + SPLIT_SEARCH_LIMIT);
    for(let y=start; y<=end; y+=2){
        const density = getBandDensity(ctx, x, y, w, 10);
        const distance = Math.abs(y - targetY);
        const score = (density * 12000) + (distance * 1.15);
        if(score < bestScore){
            bestScore = score;
            bestY = y;
        }
    }
    return bestY;
}

function getBandDensity(ctx, x, centerY, w, bandH){
    const y = Math.max(0, Math.floor(centerY - bandH / 2));
    const h = Math.min(bandH, ctx.canvas.height - y);
    if(h <= 0) return 1;
    const data = ctx.getImageData(x, y, w, h).data;
    let dark = 0;
    let total = 0;
    for(let i=0; i<data.length; i+=16){
        const r = data[i], g = data[i+1], b = data[i+2];
        const avg = (r + g + b) / 3;
        if(avg < 218) dark++;
        total++;
    }
    return total ? dark / total : 1;
}

function getContentRect(ctx, w, h){
    const data = ctx.getImageData(0, 0, w, h).data;
    let minY = h, maxY = 0, minX = w, maxX = 0, found = false;
    const step = 5;
    for(let y=0; y<h; y+=step){
        for(let x=0; x<w; x+=step){
            const idx = (y * w + x) * 4;
            const avg = (data[idx] + data[idx+1] + data[idx+2]) / 3;
            if(avg < 245){
                minY = Math.min(minY, y); maxY = Math.max(maxY, y);
                minX = Math.min(minX, x); maxX = Math.max(maxX, x);
                found = true;
            }
        }
    }
    if(!found) return null;
    const x = Math.max(0, minX - CONTENT_PAD);
    const y = Math.max(0, minY - CONTENT_PAD);
    const right = Math.min(w, maxX + CONTENT_PAD);
    const bottom = Math.min(h, maxY + CONTENT_PAD);
    return { x, y, w:Math.max(1, right-x), h:Math.max(1, bottom-y) };
}

function renderFinalCombined(allPagesContent){
    const flatParts = allPagesContent.flat();
    const maxW = Math.max(...flatParts.map(p => p.width));
    const maxPartH = Math.max(...flatParts.map(p => p.height));
    let totalHeight = OUTER_MARGIN * 2;
    allPagesContent.forEach((pageParts, pageIndex)=>{
        pageParts.forEach((part, partIndex)=>{
            totalHeight += maxPartH;
            if(partIndex < pageParts.length - 1) totalHeight += BETWEEN_PART_GAP;
        });
        if(pageIndex < allPagesContent.length - 1) totalHeight += PAGE_GAP;
    });

    previewCanvas.width = maxW;
    previewCanvas.height = totalHeight;
    const ctx = previewCanvas.getContext("2d", { alpha:false });
    ctx.fillStyle = "white";
    ctx.fillRect(0, 0, maxW, totalHeight);
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = "high";

    let curY = OUTER_MARGIN;
    drawHorizontalDashedLine(ctx, GUIDE_INSET, maxW - GUIDE_INSET, OUTER_MARGIN / 2, GUIDE_COLOR);

    allPagesContent.forEach((pageParts, pageIndex)=>{
        pageParts.forEach((part, partIndex)=>{
            const partX = Math.round((maxW - part.width) / 2);
            const partY = curY + Math.round((maxPartH - part.height) / 2);
            ctx.drawImage(part, partX, partY);
            curY += maxPartH;
            if(partIndex < pageParts.length - 1){
                const guideY = curY + Math.round(BETWEEN_PART_GAP / 2);
                drawHorizontalDashedLine(ctx, GUIDE_INSET, maxW - GUIDE_INSET, guideY, GUIDE_COLOR);
                curY += BETWEEN_PART_GAP;
            }
        });
        if(pageIndex < allPagesContent.length - 1) curY += PAGE_GAP;
    });
    drawHorizontalDashedLine(ctx, GUIDE_INSET, maxW - GUIDE_INSET, previewCanvas.height - (OUTER_MARGIN / 2), GUIDE_COLOR);
}

function drawHorizontalDashedLine(ctx, x1, x2, y, color){
    ctx.save();
    ctx.setLineDash(GUIDE_DASH);
    ctx.strokeStyle = color;
    ctx.lineWidth = GUIDE_LINE_WIDTH;
    ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(x1, y);
    ctx.lineTo(x2, y);
    ctx.stroke();
    ctx.restore();
}

shareBtn.onclick = ()=>{
    previewCanvas.toBlob((blob)=>{
        if(!blob) return;
        const file = new File([blob], "Label_Splitter_Perfect_Join.png", { type:"image/png" });
        if(navigator.canShare && navigator.canShare({ files:[file] })){
            navigator.share({ files:[file] });
        }else{
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = file.name;
            link.click();
            URL.revokeObjectURL(link.href);
        }
    }, "image/png");
};
</script>

</body>
</html>
