<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gravity Top - True Align</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
    <style>
        body { font-family: sans-serif; background: #111; color: white; padding: 20px; text-align: center; }
        .card { background: #222; padding: 25px; border-radius: 20px; max-width: 450px; margin: auto; border: 1px solid #444; }
        select { width: 100%; padding: 15px; border-radius: 12px; background: #333; color: white; border: 1px solid #555; margin: 15px 0; }
        .btn-upload { background: #007aff; color: white; padding: 18px; border-radius: 12px; cursor: pointer; display: block; font-weight: bold; }
        #pdf-upload { display: none; }
        #status { margin: 15px 0; color: #00ea8c; font-weight: bold; }
        canvas { max-width: 100%; border: 1px solid #444; margin-top: 15px; display: none; background: white; }
        .btn-share { background: #ff3b30; color: white; border: none; width: 100%; padding: 20px; border-radius: 15px; font-size: 20px; font-weight: bold; margin-top: 20px; cursor: pointer; display: none; }
    </style>
</head>
<body>

<div class="card">
    <h3>รุ่นชิดขอบบน (True Align)</h3>
    <p style="font-size: 12px; color: #aaa;">ใช้การตัดแบบเดิมที่แม่นยำ + บังคับเนื้อหาชนขอบบนสุด</p>
    
    <select id="split-num">
        <option value="2">แบ่ง 2 ท่อน</option>
        <option value="3" selected>แบ่ง 3 ท่อน</option>
        <option value="4">แบ่ง 4 ท่อน</option>
    </select>

    <label for="pdf-upload" class="btn-upload">📂 เลือกไฟล์ PDF</label>
    <input type="file" id="pdf-upload" accept="application/pdf" />
    <div id="status">รอไฟล์...</div>
</div>

<button id="share-btn" class="btn-share">📤 ส่งรูปไปปริ้น</button>
<canvas id="canvas-preview"></canvas>

<script>
    const pdfjsLib = window['pdfjs-dist/build/pdf'];
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js';

    const pdfInput = document.getElementById('pdf-upload');
    const status = document.getElementById('status');
    const shareBtn = document.getElementById('share-btn');
    const previewCanvas = document.getElementById('canvas-preview');
    const splitSelect = document.getElementById('split-num');

    pdfInput.addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const numParts = parseInt(splitSelect.value);
        status.innerText = `📡 กำลังจัดตำแหน่งชิดขอบบน...`;
        const arrayBuffer = await file.arrayBuffer();
        const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
        let finalParts = [];

        for (let i = 1; i <= pdf.numPages; i++) {
            const page = await pdf.getPage(i);
            const res = await processGravityTop(page, numParts);
            if (res) finalParts.push(...res);
        }
        renderFinal(finalParts);
    });

    async function processGravityTop(page, numParts) {
        const scale = 5.0;
        const viewport = page.getViewport({ scale });
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        canvas.width = viewport.width; canvas.height = viewport.height;
        await page.render({ canvasContext: ctx, viewport: viewport }).promise;

        const rect = getContentRect(ctx, canvas.width, canvas.height);
        if (!rect) return null;

        const topY = Math.max(0, rect.y - 50);
        const bottomY = Math.min(canvas.height, rect.y + rect.h + 20);
        const contentH = bottomY - topY;

        let splitPoints = [topY];
        for (let j = 1; j < numParts; j++) {
            let targetY = topY + Math.floor((contentH / numParts) * j);
            splitPoints.push(findSafeGap(ctx, rect.x, targetY, rect.w));
        }
        splitPoints.push(bottomY);

        let parts = [];
        for (let k = 0; k < splitPoints.length - 1; k++) {
            parts.push(drawGravityPart(canvas, rect.x, splitPoints[k], rect.w, splitPoints[k+1] - splitPoints[k]));
        }
        return parts;
    }

    function findSafeGap(ctx, x, targetY, w) {
        const range = 150; // รักษาค่าเดิมไว้เพื่อความแม่นยำ
        let bestY = targetY;
        let maxBlank = 0;
        for (let y = targetY - range; y < targetY + range; y++) {
            let count = 0;
            while (y + count < targetY + range && isClean(ctx, x, y + count, w)) count++;
            if (count > maxBlank) { maxBlank = count; bestY = y + Math.floor(count / 2); }
        }
        return bestY;
    }

    function isClean(ctx, x, y, w) {
        if (y < 0 || y >= ctx.canvas.height) return true;
        const data = ctx.getImageData(x, y, w, 1).data;
        let dark = 0;
        for (let i = 0; i < data.length; i += 20) if (data[i] < 225) dark++;
        return (dark / (data.length / 4)) < 0.01;
    }

    function getContentRect(ctx, w, h) {
        const data = ctx.getImageData(0, 0, w, h).data;
        let minY = h, maxY = 0, minX = w, maxX = 0, found = false;
        for (let y = 0; y < h; y += 50) {
            for (let x = 0; x < w; x += 50) {
                if (data[(y * w + x) * 4] < 200) {
                    minY = Math.min(minY, y); maxY = Math.max(maxY, y);
                    minX = Math.min(minX, x); maxX = Math.max(maxX, x);
                    found = true;
                }
            }
        }
        return found ? { x: minX, y: minY, w: maxX - minX, h: maxY - minY } : null;
    }

    // ฟังก์ชันที่ปรับปรุงใหม่ให้ชิดบนสุดจริง
    function drawGravityPart(source, x, y, w, h) {
        const c = document.createElement('canvas');
        const ctx = c.getContext('2d');
        const paddingBottom = 100; // พื้นที่ขาวด้านท้ายสำหรับแปะทับ
        
        c.width = h + paddingBottom; 
        c.height = w;
        ctx.fillStyle = "white";
        ctx.fillRect(0, 0, c.width, c.height);
        
        ctx.save();
        // หมุนภาพ 90 องศาให้เป็นแนวนอน
        ctx.translate(0, w); 
        ctx.rotate(-Math.PI / 2);
        
        // วาดให้ชิดพิกัด 0,0 ของแผ่นใหม่ทันที (คือบนสุดหลังหมุน)
        // พื้นที่ขาว paddingBottom จะถูกผลักไปอยู่ด้านล่างโดยอัตโนมัติ
        ctx.drawImage(source, x, y, w, h, 0, 0, w, h);
        ctx.restore();
        return c;
    }

    function renderFinal(parts) {
        const totalH = parts.reduce((s, p) => s + p.height + 20, 0);
        const maxW = Math.max(...parts.map(p => p.width));
        previewCanvas.width = maxW; previewCanvas.height = totalH;
        const ctx = previewCanvas.getContext('2d');
        ctx.fillStyle = "white"; ctx.fillRect(0, 0, maxW, totalH);
        let curY = 0;
        parts.forEach(p => {
            ctx.drawImage(p, 0, curY);
            curY += p.height + 20;
        });
        previewCanvas.style.display = 'block';
        shareBtn.style.display = 'block';
        status.innerText = `✅ ตัดแม่นยำและชิดขอบบนแล้ว!`;
    }

    shareBtn.onclick = () => {
        previewCanvas.toBlob(b => navigator.share({ files: [new File([b], 'TrueAlign_Label.png', {type:'image/png'})] }));
    };
</script>
</body>
</html>
